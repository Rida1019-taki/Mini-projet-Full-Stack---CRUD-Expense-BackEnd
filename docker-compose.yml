version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: expense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-fileRouge}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - expense-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fileRouge}
      DB_USERNAME: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SERVER_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - expense-network

  frontend:
    build:
      context: ${FRONTEND_PATH:-../../Desktop/mini-projet-full-stack}
      dockerfile: Dockerfile
    container_name: expense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - expense-network

volumes:
  mysql_data:

networks:
  expense-network:
    driver: bridge
